name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc-13, cxx: g++-13 }
          - { cc: gcc-14, cxx: g++-14 }
          - { cc: clang-16, cxx: clang++-16 }
          - { cc: clang-17, cxx: clang++-17 }
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install GCC 13
        if: matrix.compiler.cc == 'gcc-13'
        run: sudo apt-get install -y g++-13

      - name: Install GCC 14
        if: matrix.compiler.cc == 'gcc-14'
        run: sudo apt-get install -y g++-14

      - name: Install Clang 16
        if: matrix.compiler.cc == 'clang-16'
        run: sudo apt-get install -y clang-16

      - name: Install Clang 17
        if: matrix.compiler.cc == 'clang-17'
        run: sudo apt-get install -y clang-17

      - name: Configure CMake
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DWJH_SLOTMAP_BUILD_TESTS=ON \
            -DWJH_SLOTMAP_SANITIZE=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DWJH_SLOTMAP_BUILD_TESTS=ON \
            -DWJH_SLOTMAP_SANITIZE=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(sysctl -n hw.ncpu)
